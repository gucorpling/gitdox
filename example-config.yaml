instance:
  project: example
  display_name: First Example Project
  # display_image: [img/example.png, 100, 50px]  # You can add this image in src/public/img/
  # You can set up a link to your annotation guidelines like this:
  help_message: <span style="color:black">For help getting started see the</span> <a href="https://gucorpling.org/gitdox/">website</a>
  excluded_metadata: []  # Document and corpus metadata keys to always exclude on corpus import
  editors: {xml: "XML", spreadsheet: "spreadsheet", entities: "entities", dendroid: "syntax", segmenter: "segmenter", rstweb: "RST"}  # Which editors to enable (xml, spreadsheet, entities, dendroid, segmenter and/or rstweb)
  restore_from_github_level: 1  # Minimum user level (default 1) allowed to use "Restore from GitHub"


# Tools live in backend/nlp_modules/
tools:
  tokenize: {editor: xml, caption: "Tokenize", level: 0, return: "xml", color: "teal"}
  tabulate: {editor: xml, caption: "Tabulate", level: 3, return: "spreadsheet", color: "indigo"}
  #ssplit: {editor: xml, caption: "Split sentences", level: 3, return: "xml", color: "olive"}
  #stype: {editor: xml, caption: "Sentence types", level: 3, return: "xml", color: "olive"}
  #flair_tag: {editor: spreadsheet, caption: "Sparse Flair Tag", level: 2, return: "spreadsheet", color: "indigo"}
  #stanza_tag: {editor: spreadsheet, caption: "Stanza Tag", level: 2, return: "spreadsheet", color: "indigo", ablate: false}
  #diaparse: {editor: spreadsheet, caption: "Parse", level: 3, return: "dendroid", color: "olive", ablate: true}  # ablate will randomly delete some tags based on a budget distribution
  reindent: {editor: xml, caption: "Indent XML", level: 2, return: "xml", color: "olive"}


ui:
  font: 'Roboto, "Lucida Grande", "Lucida Sans Unicode", "Lucida Sans", "DejaVu Sans", Verdana, sans-serif'
  nav_background_color: "#174274"
  panel_background_color: "#dddddd"
  max_validator_warn_per_rule: 8
  table_header_background_color: "darkgray"
  background_color: "#174274"
  #background_image: "img/parchment.jpg"
  # Optional embedded web fonts loaded at runtime via @font-face.
  # Place files under gitdox/public/fonts/ and reference them as /fonts/...
  embedded_fonts:
    - family: "Roboto"
      style: normal
      weight: "400"
      display: swap
      sources:
        - path: "/fonts/Roboto-VariableFont_wdth,wght.ttf"
          format: "truetype"

# Spannotator UI configuration
entities:  
  annotations:
    entity: # Name and values for the spreadsheet column for entity types and entity identities (linked open data IDs)
      entity: [abstract, animal, event, object, organization, person, place, plant, substance, time]
      identity: identity
      ner_pos: 
        pos: [NNP, NNPS, NP, NPS, NPROP]
    keys:  # Key - value annotations expected on every entity, default value first. Use "" for any string
      infstat:
        values: [auto, new, acc, giv, split]  # possible values
        stars:  # values triggering star icon
          acc: "yellow"  # star color
          split: "green"
    checks:  # Annotation keys that create n checkboxes and their internal concatenated char values, false then true
      salience: [5, 'n', 's']
  carousel:
    keys: [Summary1, Summary2, Summary3, Summary4, Summary5] # Metadata string keys to cycle at top of UI carousel
    sync: "salience"
  colors:
    groups: {coref: [chain, sametype], split: [star, anytype]}
    edges:
      bridge:
        bridgetype: [nobridge, comparison-relative, comparison-sense, comparison-time, entity-associative, entity-meronymy, entity-property, entity-resultative, set-member, set-subset, set-span-interval, other]
        show_coarse: true
        coarse_separator: '-'
  first_mentions: true  # Whether to show the "Highlight First Mentions" button for bridging and anaphora resolution in the entities view (only makes sense if you have coreference annotations)
  font: "Times New Roman"
  guess_identities: true  # Whether to show the "Guess Identities" button in the Named Entity Linking interface
  require_identities: true  # Whether to show a validation error for documents with unidentified named entities
  sentences: sent  # Column name for sentence spans, should cover all tokens in the document
  sentence_mode: true
  sentence_tooltip: translation
  show_entity_linking: true
  tokens: tok # Column name for underlying word forms
  webanno_order: [entity, infstat, salience, identity]

xml:
  font: "Antinoou"
  tags: gum.json  # Name of .json file in schemas/xml_tags/ with tags specification for XML tag auto-suggest
  auto_indent: false
  line_wrapping: true

spreadsheet:
  column_order: [tok, pos, lemma, s_type, entity, infstat, salience, identity]
  font: "Times New Roman"
  copy_paste_level: 0

dendroid:  # Syntax tree editor
  multiuser: true  # Allow each user to have their own version of each tree
  mwt: ""  # Name for CoNLL-U multiword token annotation, set to "" to turn off support
  ellipsis: false  # Support for 'empty' decimal tokens with IDs like 5.1
  default_annotator: "parser"
  hide_duplicate_edeps: true
  token_distance: 30  # Horizontal gap in pixels between word tokens in the tree (default 30)
  hover_highlight: false  # Increase edge stroke width on hover of an edge or its dependency label, to help trace overlapping edges
  token_annotations:
    word: tok
    xpos: pos
    upos: ""  # Use empty string to switch off
    feats: morph
    head: head
    deprel: func
    edeps: ""
    misc: ""
  tagsets:
    upos: []  # Can be [] or "" if not using
    xpos: ["NN", "IN", "DT", "JJ", "NNP", "PRP", ",", ".", "RB", "NNS", "VB", "CC", "VBP", "VBD", "VBZ", "VBN", "CD", "VBG", "TO", "PRP$", "MD", "UH", ":", "WDT", "-LRB-", "-RRB-", "WRB", "HYPH", "RP", "''", "``", "WP", "POS", "NNPS", "JJR", "RBR", "EX", "JJS", "FW", "SYM", "PDT", "RBS", "LS", "$", "WP$", "GW"]
    deprels: ["punct", "case", "det", "nsubj", "root", "advmod", "amod", "obj", "obl", "nmod", "conj", "cc", "mark", "compound", "aux", "cop", "advcl", "nmod:poss", "xcomp", "acl:relcl", "flat", "acl", "discourse", "ccomp", "aux:pass", "parataxis", "nsubj:pass", "nummod", "appos", "compound:prt", "obl:unmarked", "fixed", "expl", "dep", "reparandum", "nmod:unmarked", "iobj", "obl:agent", "csubj", "advcl:relcl", "nmod:desc", "det:predet", "vocative", "list", "orphan", "cc:preconj", "dislocated", "goeswith", "csubj:pass"]
    edeprels: []
  sentence_annotations: [translation, verse_n]
  sentence_span: translation
  sentence_text: ""  # Use empty string to compute from tokens

segmenter:  # Discourse unit / sentence segmentation editor
  font: "Verdana"  # Widget font (defaults to the UI font)
  font_size: "10pt"  # Pixels, or a CSS length such as "1.2em"
  line_spacing: 1.5  # Line height multiplier
  word_spacing: 0  # Horizontal gap between words, in pixels or a CSS length
  nesting: true  # true: layers must nest in declaration order (big to small, violations raise an error), only the largest marker at a position is shown and adding a break also adds it to all smaller layers. false: layers are independent and all markers are shown
  words: "tok"  # Column header for column supplying the words to display (could be spans)
  layers:  # Column header names for segmentations to support, in nesting order from largest to smallest
    paragraph: ["--","red","sequential"]  # name: ["sep", "color", "sequential/words"]  - sequential means span value content is auto-updating sequential numbers, words means the space-joined content of all covered words cells. Other values mean a default, fixed value to use, but values are not edited by the interface unless empty (in which case the default is inserted)
    sentence: ["||", "blue","sequential"]
    edu: ["|", "green", ""]  # Shared with rstweb.edu: must use an empty default, since the cells also hold RST node ids and relations

rstweb:  # RST / eRST discourse tree editor (reads EDUs from the segmenter's edu layer)
  words: "tok"  # Column header supplying the word tokens (could be spans)
  edu: "edu"  # Column of EDU spans, cells hold id:relation:parent. If the segmenter edits this layer too, give it an empty default value, e.g. edu: ["|", "green", ""], since the "words" style would overwrite these cells
  node: "node"  # Header shared by the columns holding non-terminal span/multinuc nodes (as many columns as needed are added)
  secedge: "secedge"  # Column for secondary (eRST) edges. Set to "" to disable secondary edges altogether
  signal: "signal"  # Column for eRST signals. Set to "" to disable signals altogether
  disable_spans: false  # No span buttons available (e.g. for flat RST dependencies between EDUs only)
  disable_multinucs: false  # No multinuclear buttons
  disable_secedge: false  # No eRST secondary edges (same effect as secedge: "")
  use_signals: true  # Shows (S) buttons on nodes and turns on signal coloring by default (false has the same effect as signal: ""; needs signal_types)
  # default_rst: elaboration-additional  # Relation given to newly attached satellites (default: alphabetically first of rst)
  # default_multinuc: joint-other  # Relation given to new multinuc children (default: alphabetically first of multinuc)
  relations:  # The single relation inventory of this project. The names "span" and "multinuc" are built into the format and cannot be used or changed; only the labels below are configurable
    rst: [adversative-antithesis, adversative-concession, attribution-negative, attribution-positive, causal-cause, causal-result, context-background, context-circumstance, contingency-condition, elaboration-additional, elaboration-attribute, evaluation-comment, explanation-evidence, explanation-justify, explanation-motivation, mode-manner, mode-means, organization-heading, organization-phatic, organization-preparation, purpose-attribute, purpose-goal, restatement-partial, topic-question, topic-solutionhood]
    multinuc: [adversative-contrast, joint-disjunction, joint-list, joint-other, joint-sequence, restatement-repetition, same-unit]
  relation_labels:  # Optional short names shown in the relation dropdowns (the full name is used if absent)
    adversative-antithesis: antithesis
    adversative-concession: concession
    adversative-contrast: contrast
    attribution-negative: attrib.-negative
    attribution-positive: attrib.-positive
    causal-cause: cause
    causal-result: result
    context-background: background
    context-circumstance: circumstance
    contingency-condition: condition
    elaboration-additional: elab.-additional
    elaboration-attribute: elab.-attribute
    evaluation-comment: eval.-comment
    explanation-evidence: evidence
    explanation-justify: justify
    explanation-motivation: motivation
    joint-disjunction: disjunction
    joint-list: list
    joint-other: other
    joint-sequence: sequence
    mode-manner: manner
    mode-means: means
    organization-heading: heading
    organization-phatic: phatic
    organization-preparation: preparation
    purpose-attribute: purp.-attribute
    purpose-goal: purp.-goal
    restatement-partial: restat.-partial
    restatement-repetition: restat.-repetition
    topic-question: question
    topic-solutionhood: solutionhood
  signal_types:  # Signal type: [subtypes]
    dm: [dm]
    graphical: [colon, dash, items_in_sequence, layout, parentheses, question_mark, quotation_marks, semicolon]
    lexical: [alternate_expression, indicative_phrase, indicative_word]
    morphological: [mood, tense]
    numerical: [same_count]
    orphan: [orphan]
    reference: [comparative_reference, demonstrative_reference, personal_reference, propositional_reference]
    semantic: [antonymy, attribution_source, lexical_chain, meronymy, negation, repetition, synonymy]
    syntactic: [causal_excess, infinitival_clause, interrupted_matrix_clause, modified_head, nominal_modifier, parallel_syntactic_construction, past_participial_clause, present_participial_clause, relative_clause, reported_speech, subject_auxiliary_inversion]
    unsure: [unsure]
